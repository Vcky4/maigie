<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>{{ title }}</title>
</head>

<body
    style="font-family: Helvetica, Arial, sans-serif; color: #333333; line-height: 1.6; padding: 20px; background-color: #ffffff;">

    <div style="max-width: 600px; margin: 0;">
        {% if logo_url %}
        <div style="margin-bottom: 30px; text-align: center;">
            <img src="{{ logo_url }}" alt="{{ app_name }}" style="max-width: 200px; height: auto;" />
        </div>
        {% endif %}

        <h1 style="color: #222222; font-size: 24px; font-weight: bold; margin-bottom: 20px;">
            {{ title }}
        </h1>

        {% if name %}
        <p style="margin-bottom: 15px;">Hi {{ name }},</p>
        {% endif %}

        <!-- pre-line keeps the line breaks of a multi-line notification body, which a
             summary uses for its figures. Without it they collapse into one run-on line. -->
        <p style="margin-bottom: 25px; white-space: pre-line;">{{ body }}</p>

        <div style="margin-bottom: 30px;">
            <a href="{{ action_url }}" style="
                background-color: #4F46E5;
                color: #ffffff;
                display: inline-block;
                padding: 12px 24px;
                border-radius: 5px;
                font-size: 16px;
                font-weight: bold;
                text-decoration: none;">
                Open {{ app_name }}
            </a>
        </div>

        <p style="font-size: 12px; color: #999999; margin-top: 20px; border-top: 1px solid #eeeeee; padding-top: 20px;">
            You are receiving this because {{ category_reason }}.
            <a href="{{ settings_url }}" style="color: #4F46E5;">Change what Maigie emails you</a>.
            <br><br>
            {{ app_name }} — The Academic Operating System
        </p>
    </div>

</body>

</html>
