{#
  One-time code block. Expects `code` and `expires_minutes` in the context.
  The digits sit in a real table cell so Outlook renders the padding and the
  code stays selectable text rather than an image.
#}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0;">
    <tr>
        <td align="center" style="background-color:#f9fafb; border:1px solid #e5e7eb; border-radius:10px; padding:22px 16px;">
            <div style="font-family:Consolas,'Courier New',monospace; font-size:32px; line-height:1.2; font-weight:bold; color:#111827; letter-spacing:8px; text-indent:8px; white-space:nowrap;">{{ code }}</div>
            <div style="font-family:Helvetica,Arial,sans-serif; font-size:12px; line-height:1.5; color:#6b7280; padding-top:10px;">Expires in {{ expires_minutes }} minutes</div>
        </td>
    </tr>
</table>
